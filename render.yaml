services:
  - type: web
    name: xiao-yazi
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --host 0.0.0.0 --port $PORT
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_PASSWORD
        sync: false
